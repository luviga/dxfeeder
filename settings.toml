# Settings of dxfeeder.
#
# Every numeric constant of the package lives in this file, never in the code.
# Each setting is one table with three keys:
#   value   the number, text or list that the code reads
#   label   SOURCE, ASSUMPTION or ESTIMATION
#   reason  for SOURCE, the external address (URL, DOI or permalink with commit hash);
#           for ASSUMPTION or ESTIMATION, one or two plain sentences that explain the value
# A table may also group settings, and then each setting inside it follows the same rule.

# Feeder generator: inputs read from OpenStreetMap.

[street_highway_values]
value = ["motorway", "motorway_link", "trunk", "trunk_link", "primary", "primary_link", "secondary", "secondary_link", "tertiary", "tertiary_link", "residential", "unclassified", "service"]
label = "ASSUMPTION"
reason = "Drivable street classes from motorway down to residential, plus unclassified and service roads, with the link roads of each class (tag values listed at https://wiki.openstreetmap.org/wiki/Key:highway). Feeders follow streets that a line crew can drive along; footways, paths and tracks are left out."

[building_skipped_values]
value = ["no"]
label = "ASSUMPTION"
reason = "A building tag with the value no marks a feature that is not a building (https://wiki.openstreetmap.org/wiki/Key:building), so it gives no load."

[substation_tag_key]
value = "power"
label = "SOURCE"
reason = "OpenStreetMap tags a substation with power=substation (https://wiki.openstreetmap.org/wiki/Tag:power%3Dsubstation)."

[substation_tag_value]
value = "substation"
label = "SOURCE"
reason = "OpenStreetMap tags a substation with power=substation (https://wiki.openstreetmap.org/wiki/Tag:power%3Dsubstation)."

# Feeder generator: loads and voltages.

[load_kw_default]
value = 5.0
label = "ASSUMPTION"
reason = "Every building carries the same 5 kW load, a placeholder for residential diversified demand until measured load profiles are attached."

[load_pf]
value = 0.95
label = "ASSUMPTION"
reason = "Every load has a power factor of 0.95 lagging, a placeholder typical of residential demand."

[mv_kv]
value = 12.47
label = "ASSUMPTION"
reason = "Every feeder runs at 12.47 kV line to line, a common North American distribution class and the medium voltage of the SMART-DS Austin feeders. The voltage tag of a substation never sets the feeder voltage, because it names the transmission side."

[lv_kv]
value = 0.24
label = "ASSUMPTION"
reason = "Every load is served at 0.24 kV, the North American residential secondary voltage."

# Feeder generator: routes, feeders and transformers.

[snap_m]
value = 30.0
label = "ASSUMPTION"
reason = "A vertex of a mapped distribution line within 30 m of a street node joins that node; mapped lines usually run along the street edge, within a road width of its centre line."

[forced_route_weight_factor]
value = 0.01
label = "ASSUMPTION"
reason = "A mapped distribution line segment weighs 1 percent of its length in the shortest path search, so feeders prefer mapped routes without being barred from streets."

[loads_per_transformer_max]
value = 12
label = "ASSUMPTION"
reason = "A distribution transformer serves at most 12 loads, in the range of a pole or pad transformer serving a group of houses."

[transformer_radius_m]
value = 150.0
label = "ASSUMPTION"
reason = "A load joins a transformer only within 150 m along the service drop and the tree, the reach of a low voltage secondary."

[transformer_loading_factor]
value = 0.8
label = "ASSUMPTION"
reason = "A transformer is sized so that its loads use 80 percent of its rating, leaving a margin for growth and peaks."

[transformer_sizes_kva]
value = [10.0, 15.0, 25.0, 37.5, 50.0, 75.0, 100.0, 167.0, 250.0, 333.0, 500.0]
label = "ASSUMPTION"
reason = "Standard ratings of distribution transformers in North American practice; each transformer takes the smallest rating at or above its sized load."

[transformer_pct_r]
value = 1.0
label = "ASSUMPTION"
reason = "Each distribution transformer has a winding resistance of 1 percent on its own rating, a typical value for small units."

[transformer_xhl_pct]
value = 2.0
label = "ASSUMPTION"
reason = "Each distribution transformer has a leakage reactance of 2 percent on its own rating, a typical value for small units."

[line_length_min_m]
value = 1.0
label = "ASSUMPTION"
reason = "A line shorter than 1 m is written as 1 m long, so that no line of zero impedance enters the model."

