# Feeder generator: number formats of the written files.

[metres_per_km]
value = 1000.0
label = "SOURCE"
reason = "One kilometre is 1000 metres by the SI definition of the kilo prefix (https://www.bipm.org/en/publications/si-brochure)."

[length_decimals]
value = 6
label = "ASSUMPTION"
reason = "Line lengths are written in km with 6 decimals, a resolution of 1 mm; the format only fixes the bytes of the files."

[coordinate_decimals]
value = 7
label = "ASSUMPTION"
reason = "Bus coordinates are written in degrees with 7 decimals, about 1 cm on the ground; the format only fixes the bytes of the files."

# Verification.

[energized_voltage_min_pu]
value = 0.0
label = "ASSUMPTION"
reason = "A load counts as connected when its bus voltage after the snapshot solve is above zero per unit, the plain reading of an energized bus."

[distribution_transformer_lv_max_kv]
value = 1.0
label = "ASSUMPTION"
reason = "A transformer counts as a distribution transformer when its lowest winding is at or below 1 kV, the upper limit of low voltage in IEC 60038 (https://webstore.iec.ch/en/publication/153)."

[convergence_words]
value = ["converge", "max control iterations"]
label = "ASSUMPTION"
reason = "OpenDSS messages that hold one of these words report a solve that did not converge rather than a definition error, so they count against the solve and not against the compile."

[length_units]
value = ["none", "mi", "kft", "km", "m", "ft", "in", "cm", "mm"]
label = "SOURCE"
reason = "Order of the OpenDSS line length unit codes 0 to 8, as listed for the Units property of the Line object (https://opendss.epri.com/Line.html). Each name points at a length_unit_km setting."

[length_unit_km_none]
value = 1.0
label = "ASSUMPTION"
reason = "A line with Units=none is read as kilometres. OpenDSS then takes the length in the units of its line code; the case is counted and reported."

[length_unit_km_mi]
value = 1.609344
label = "SOURCE"
reason = "One international mile is 1.609344 km (NIST Handbook 44, Appendix C, https://www.nist.gov/pml/owm/publications/nist-handbooks/handbook-44)."

[length_unit_km_kft]
value = 0.3048
label = "SOURCE"
reason = "One thousand international feet is 0.3048 km (NIST Handbook 44, Appendix C, https://www.nist.gov/pml/owm/publications/nist-handbooks/handbook-44)."

[length_unit_km_km]
value = 1.0
label = "SOURCE"
reason = "Identity conversion for lengths already in kilometres."

[length_unit_km_m]
value = 0.001
label = "SOURCE"
reason = "One metre is 0.001 km by the SI kilo prefix (https://www.bipm.org/en/publications/si-brochure)."

[length_unit_km_ft]
value = 0.0003048
label = "SOURCE"
reason = "One international foot is 0.0003048 km (NIST Handbook 44, Appendix C, https://www.nist.gov/pml/owm/publications/nist-handbooks/handbook-44)."

[length_unit_km_in]
value = 0.0000254
label = "SOURCE"
reason = "One inch is 0.0000254 km (NIST Handbook 44, Appendix C, https://www.nist.gov/pml/owm/publications/nist-handbooks/handbook-44)."

[length_unit_km_cm]
value = 0.00001
label = "SOURCE"
reason = "One centimetre is 0.00001 km by the SI prefixes (https://www.bipm.org/en/publications/si-brochure)."

[length_unit_km_mm]
value = 0.000001
label = "SOURCE"
reason = "One millimetre is 0.000001 km by the SI prefixes (https://www.bipm.org/en/publications/si-brochure)."
