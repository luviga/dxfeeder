[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dxfeeder"
dynamic = ["version"]
description = "Synthetic OpenDSS distribution feeders for North American areas, from OpenStreetMap and open data."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "geopandas>=1.2.0",
    "pyogrio>=0.13.0",
    "shapely>=2.2.0",
    "pyproj>=3.8.0",
    "osmium>=4.3.2",
    "networkx>=3.7",
    "rasterio>=1.5.2",
    "pandas>=3.1.1",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
]

[project.optional-dependencies]
verify = ["opendssdirect.py>=0.9.4"]

[project.scripts]
dxfeeder = "dxfeeder.cli:main"

[tool.hatch.version]
path = "dxfeeder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dxfeeder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The OpenDSS engine raises and catches its own exceptions; the fault handler would print each one as a fatal error.
addopts = "-p no:faulthandler"
